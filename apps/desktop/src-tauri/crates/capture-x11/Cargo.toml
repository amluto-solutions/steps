[package]
name = "capture-x11"
description = "The Linux (X11) counterpart of capture-win32: input, windows, monitors and screenshots, in safe Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Linux only: on other platforms the crate is empty (src/lib.rs), so `cargo` commands over the
# whole workspace still work on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
crossbeam-queue = "0.3.14"
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"
# Not 0.14 (07/10/2026): it can't connect to an X server that only takes local connections
# (`Xvfb -nolisten tcp`, as Ubuntu's X11 sessions run), so recording said "X11 session only".
x11rb = { version = "0.13.2", features = ["xinput", "randr", "screensaver"] }
xkeysym = "0.2.1"

[lints]
workspace = true
