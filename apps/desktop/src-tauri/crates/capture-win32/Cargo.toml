[package]
name = "capture-win32"
description = "The only crate allowed `unsafe`: safe wrappers over Win32 input, window and token calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Windows only: on other platforms the crate is empty (src/lib.rs).
[target.'cfg(windows)'.dependencies]
crossbeam-queue = "0.3.14"
thiserror = "2.0.21"
# Already in the build (the updater's downloads); its named pipes do the overlapped I/O a pipe
# read and written at once needs (pipe.rs).
tokio = { version = "1.53.1", default-features = false, features = ["net"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Controls", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Display", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Mapi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Storage_Packaging_Appx", "Win32_UI_Accessibility", "Win32_System_StationsAndDesktops", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "ApplicationModel", "ApplicationModel_Activation"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "io-util"] }

[features]
# Synthetic input for the Phase 1 test driver only. The app never enables this:
# an input-injection function has no place in the shipped binary.
test-driver = ["windows/Win32_UI_Input_Pointer"]
