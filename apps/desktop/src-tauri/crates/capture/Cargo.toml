[package]
name = "capture"
description = "Click pipeline, UIA lookups, screenshots and coordinate conversion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"

# The operating system layer (`capture::platform`): Win32 and UI Automation on Windows, X11 and
# AT-SPI on Linux.
[target.'cfg(windows)'.dependencies]
capture-win32 = { version = "1.0.0", path = "../capture-win32" }
uiautomation = { version = "0.25.1", features = ["event", "pattern"] }
xcap = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
capture-x11 = { version = "1.0.0", path = "../capture-x11" }
zbus = "5.19.0"

[lints]
workspace = true
