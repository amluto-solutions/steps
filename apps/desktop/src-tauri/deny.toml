# cargo-deny: licences, advisories, duplicate versions and sources (docs/engineering.md#rust).

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) unic-* crates pulled in by tauri-utils -> urlpattern 0.3.
# Nothing we can swap out while using Tauri; revisit on each Tauri upgrade. Added 24/09/2026.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, unmaintained, via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, unmaintained, via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, unmaintained, via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, unmaintained, via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, unmaintained, via tauri-utils/urlpattern" },
  # Linux only (30/09/2026): a build-time macro crate under gtk-rs 0.18, which Tauri's Linux
  # windows, menus and tray use. Not in the program; goes when Tauri moves to a newer gtk-rs.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained, via gtk-rs 0.18 (Tauri on Linux)" },
  # Linux only (21/10/2026, #124): zbus 6 took these in, and they're no longer kept up on their
  # own. zbus 5 has to stay while tauri-plugin-single-instance needs it on Linux (every release
  # to 2.5.4 and 3.0.0-alpha.3 asks for ^5.9); our AT-SPI code (crates/capture) moving to zbus 6
  # alone would build both. Unmaintained, not vulnerable. Remove when that plugin moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained (now part of zbus 6), via zbus 5: tauri-plugin-single-instance and AT-SPI on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained (now part of zbus 6), via zbus 5: tauri-plugin-single-instance and AT-SPI on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained (now part of zbus 6), via zbus 5: tauri-plugin-single-instance and AT-SPI on Linux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences, plus the few Tauri's dependency tree needs; each extra one has its reason.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "OFL-1.1",
  "Unicode-3.0",   # unicode-ident and ICU data: permissive
  "CC0-1.0",       # public-domain dedication
  "BSL-1.0",       # Boost: permissive
  "MPL-2.0",       # cssparser/selectors via Tauri; file-level copyleft, used unmodified; source location goes in the third-party notices
]
exceptions = []

[licenses.private]
ignore = true

[bans]
# Tauri pulls several versions of windows-sys and friends; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
